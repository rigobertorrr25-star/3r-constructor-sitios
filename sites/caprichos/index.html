    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fffdfb;
        transition: opacity 0.4s ease-out;
      }
      #app-loader img {
        width: 96px;
        height: 96px;
        border-radius: 9999px;
        object-fit: cover;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        animation: app-loader-pulse 1.3s ease-in-out infinite;
      }
      @keyframes app-loader-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.06); opacity: 0.85; }
      }
      #app-loader.app-loader-hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <div id="app-loader">
      <img src="%BASE_URL%brand/logo.jpg" alt="Caprichos" />
    </div>
    <div id="root"></div>
    <script>
      // GitHub Pages SPA redirect companion (https://github.com/rafgraph/spa-github-pages)
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
