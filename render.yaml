# Blueprint de Render para la API (apps/api). En el panel de Render: New → Blueprint → elige este
# repositorio y sigue las instrucciones; te va a pedir que rellenes las variables marcadas abajo.
# El frontend (apps/web) NO va aquí — se despliega aparte en Vercel (ver README).
services:
  - type: web
    name: 3r-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build -w api && npm run db:deploy -w api
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: WEB_ORIGIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: SITES_ROOT_HOST
        sync: false
      - key: SITES_URL_TEMPLATE
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
